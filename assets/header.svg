<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111820"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="880" height="220" rx="10" fill="url(#bg)"/>
  <ellipse cx="720" cy="108" rx="190" ry="145" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#21262d" stroke-width="1" opacity="0.75">
    <line x1="0" y1="34" x2="880" y2="34"/>
    <line x1="0" y1="188" x2="880" y2="188"/>
    <line x1="522" y1="34" x2="522" y2="188"/>
    <line x1="742" y1="34" x2="742" y2="188" opacity="0.45"/>
  </g>

  <!-- top status -->
  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="10"
  >
    <circle cx="24" cy="17" r="3" fill="#3fb950"/>

    <text x="34" y="21" fill="#8b949e">
      hackycy / main
    </text>

    <text x="492" y="21" text-anchor="end" fill="#8b949e">
      status: building
    </text>

    <text x="856" y="21" text-anchor="end" fill="#58a6ff">
      OPEN SOURCE
    </text>
  </g>

  <!-- identity -->
  <g>
    <text
      x="26"
      y="91"
      font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
      font-size="40"
      font-weight="650"
      fill="#f0f6fc"
      letter-spacing="0.3"
    >
      hackycy
    </text>

    <text
      x="27"
      y="121"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="12"
      fill="#58a6ff"
      letter-spacing="2.6"
    >
      FULL-STACK · OPEN SOURCE · AI TOOLS
    </text>

    <text
      x="27"
      y="153"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      fill="#8b949e"
    >
      TypeScript  ·  Vue  ·  Node.js  ·  Docker  ·  Agent Skills
    </text>
  </g>

  <!-- workflow -->
  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
  >
    <text x="552" y="58" font-size="9" fill="#8b949e">
      workflow
    </text>

    <!-- idea -->
    <g font-size="9" text-anchor="middle">
      <circle
        cx="584"
        cy="86"
        r="13"
        fill="#0d1117"
        stroke="#58a6ff"
        stroke-width="1.2"
      />

      <path
        d="M580 84c0-4 8-4 8 0 0 2-2 3-3 4v2h-2v-3c1-1 3-2 3-3 0-2-4-2-4 0z"
        fill="#58a6ff"
      />

      <rect
        x="581"
        y="91"
        width="6"
        height="2"
        rx="1"
        fill="#58a6ff"
        opacity="0.75"
      />

      <text x="584" y="112" fill="#8b949e">
        idea
      </text>

      <!-- code -->
      <rect
        x="648"
        y="73"
        width="28"
        height="26"
        rx="5"
        fill="#0d1117"
        stroke="#a371f7"
        stroke-width="1.2"
      />

      <text x="662" y="90" fill="#a371f7" font-size="12">
        &lt;/&gt;
      </text>

      <text x="662" y="112" fill="#8b949e">
        code
      </text>

      <!-- ship -->
      <path
        d="M734 75 h25 l7 11 -7 11 h-25 l7-11z"
        fill="#0d1117"
        stroke="#3fb950"
        stroke-width="1.2"
      />

      <path
        d="M742 86h13m-4-4 4 4-4 4"
        fill="none"
        stroke="#3fb950"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <text x="750" y="112" fill="#8b949e">
        ship
      </text>
    </g>

    <!-- connectors -->
    <line
      x1="601"
      y1="86"
      x2="641"
      y2="86"
      stroke="#30363d"
    />

    <line
      x1="680"
      y1="86"
      x2="728"
      y2="86"
      stroke="#30363d"
    />

    <!-- moving dot 1 -->
    <circle r="2" fill="#58a6ff">
      <animate
        attributeName="cx"
        values="603;639"
        dur="2.4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="cy"
        values="86;86"
        dur="2.4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.15;0.85;1"
        dur="2.4s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- moving dot 2 -->
    <circle r="2" fill="#3fb950">
      <animate
        attributeName="cx"
        values="682;726"
        dur="2.4s"
        begin="1.2s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="cy"
        values="86;86"
        dur="2.4s"
        begin="1.2s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;1;1;0"
        keyTimes="0;0.15;0.85;1"
        dur="2.4s"
        begin="1.2s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- terminal -->
    <text x="552" y="143" font-size="9" fill="#8b949e">
      terminal
    </text>

    <rect
      x="552"
      y="151"
      width="278"
      height="24"
      rx="5"
      fill="#010409"
      stroke="#30363d"
    />

    <text x="564" y="167" font-size="10" fill="#3fb950">
      $
    </text>

    <text x="578" y="167" font-size="10" fill="#c9d1d9">
      build → learn → ship → repeat
    </text>

    <!-- cursor -->
    <rect
      x="769"
      y="158"
      width="6"
      height="11"
      rx="1"
      fill="#58a6ff"
    >
      <animate
        attributeName="opacity"
        values="1;1;0;0;1"
        keyTimes="0;0.45;0.5;0.95;1"
        dur="1.1s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <!-- animated bottom progress -->
  <rect
    x="26"
    y="198"
    width="828"
    height="3"
    rx="1.5"
    fill="#21262d"
  />

  <rect
    x="26"
    y="198"
    height="3"
    rx="1.5"
    fill="url(#accent)"
    width="0"
  >
    <animate
      attributeName="width"
      values="0;828;828;0"
      keyTimes="0;0.7;0.94;1"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- footer -->
  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="9"
    fill="#8b949e"
  >
    <text x="26" y="215">
      github.com/hackycy
    </text>

    <text x="854" y="215" text-anchor="end">
      keep shipping.
    </text>
  </g>
</svg>
